apis:
- name: Redaptive ONE Core API
  description: 'The core API gateway behind the Redaptive ONE platform, serving the account,
    portfolio and building-insights surfaces of the ONE web application. Access is OAuth 2.0
    protected: every path returns 401 to an anonymous client, but the gateway serves an RFC 8414
    Authorization Server Metadata document without credentials, which is the only machine-readable
    contract Redaptive publishes anonymously.'
  humanURL: https://one.redaptive.com/
  baseURL: https://core.api.prod.redaptivegroup.com/api/core/v1
