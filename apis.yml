aid: redaptive
name: Redaptive
description: 'Redaptive is an energy infrastructure modernization company that funds, installs,
  and measures energy-saving and energy-generating equipment across large multi-site commercial,
  industrial, healthcare and real-estate portfolios under an Efficiency-as-a-Service and
  Energy-as-a-Service model, so customers modernize lighting, HVAC, refrigeration, solar and EV
  infrastructure without capital expenditure. Its Redaptive ONE platform meters electricity, gas
  and water at the asset level and turns that telemetry into portfolio consumption, sustainability
  benchmarking and ESG reporting. Redaptive contracts an API and an SDK to Data Solutions
  customers under published terms, but the reference and specification are not public.'
